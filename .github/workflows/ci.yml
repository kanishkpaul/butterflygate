name: public artifact checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-figures.txt
      - run: python scripts/validate_results.py
      - run: python scripts/plot_results.py
      - run: python benchmark/bench_forward.py --help
